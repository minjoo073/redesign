<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 부자관광</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header site-header--sub">
    <div class="site-header__inner">
      <a href="index.html" class="site-header__brand">
        <img src="assets/logo_img.png" alt="부자관광">
      </a>
      <nav class="nav">
        <ul class="nav__menu">
          <li><a href="about.html" class="nav__link">회사소개</a></li>
          <li><a href="index.html#service" class="nav__link">서비스</a></li>
          <li><a href="vehicles.html" class="nav__link">차량안내</a></li>
          <li><a href="index.html#review" class="nav__link">고객후기</a></li>
          <li><a href="contact.html" class="nav__link">문의하기</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="auth">
    <div class="container">
      <div class="auth-card">
        <a href="index.html" class="auth-card__brand">
          <img src="assets/logo_img.png" alt="부자관광">
        </a>
        <h1 class="auth-card__title">로그인</h1>
        <p class="auth-card__lead">부자관광 회원이신가요? 로그인해주세요.</p>

        <form id="login-form" class="auth-form" novalidate>
          <label class="form__field">
            <span>이메일 또는 아이디</span>
            <input type="text" name="username" placeholder="example@email.com" required autocomplete="username">
          </label>
          <label class="form__field">
            <span>비밀번호</span>
            <input type="password" name="password" placeholder="비밀번호를 입력해주세요" required autocomplete="current-password">
          </label>

          <div class="auth-form__options">
            <label class="form__check">
              <input type="checkbox" name="remember">
              <span>로그인 상태 유지</span>
            </label>
            <a href="#" class="auth-form__link">비밀번호 찾기</a>
          </div>

          <button type="submit" class="btn btn--primary auth-form__submit">로그인</button>
          <p id="login-status" class="form__status" aria-live="polite"></p>
        </form>

        <p class="auth-card__footer">
          아직 회원이 아니신가요?
          <a href="signup.html" class="auth-card__link">회원가입</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="site-footer site-footer--mini">
    <div class="container">
      <ul class="site-footer__mini-links">
        <li><a href="about.html">회사소개</a></li>
        <li><a href="#">이용약관</a></li>
        <li><a href="#"><strong>개인정보처리방침</strong></a></li>
        <li><a href="#">자주 묻는 질문</a></li>
        <li><a href="contact.html">고객센터</a></li>
        <li><a href="#">사이트맵</a></li>
      </ul>
      <div class="site-footer__mini-main">
        <img src="assets/footer_logo.png" alt="부자관광" class="site-footer__logo">
        <div class="site-footer__mini-meta">
          <p>(주)부자관광<span class="sep">·</span>대표 <strong>오기영</strong><span class="sep">·</span>사업자등록번호 123-45-67890</p>
          <p>경기도 평택시 OO로 123, 4층<span class="sep">·</span>대표전화 <strong>1577-0000</strong><span class="sep">·</span>이메일 contact@bujatour.co.kr</p>
          <p class="copyright">&copy; <span id="year"></span> Buja Tour. All rights reserved.</p>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
