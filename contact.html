<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문의하기 | 부자관광</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header site-header--sub">
    <div class="site-header__inner">
      <a href="index.html" class="site-header__brand">
        <img src="assets/logo_img.png" alt="부자관광">
      </a>
      <nav class="nav">
        <ul class="nav__menu">
          <li><a href="about.html" class="nav__link">회사소개</a></li>
          <li><a href="vehicles.html" class="nav__link">차량안내</a></li>
          <li><a href="reviews.html" class="nav__link">고객후기</a></li>
          <li><a href="contact.html" class="nav__link active">문의하기</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <p class="section__eyebrow">CONTACT</p>
        <h2 class="section__title">문의하기</h2>
        <form id="contact-form" class="form" novalidate>
          <label class="form__field">
            <span>이름</span>
            <input type="text" name="name" required>
          </label>
          <label class="form__field">
            <span>이메일</span>
            <input type="email" name="email" required>
          </label>
          <label class="form__field">
            <span>문의 내용</span>
            <textarea name="message" rows="5" required></textarea>
          </label>
          <button type="submit" class="btn btn--primary">보내기</button>
          <p id="form-status" class="form__status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer site-footer--mini">
    <div class="container">
      <ul class="site-footer__mini-links">
        <li><a href="about.html">회사소개</a></li>
        <li><a href="#">이용약관</a></li>
        <li><a href="#"><strong>개인정보처리방침</strong></a></li>
        <li><a href="#">자주 묻는 질문</a></li>
        <li><a href="contact.html">고객센터</a></li>
        <li><a href="#">사이트맵</a></li>
      </ul>
      <div class="site-footer__mini-main">
        <img src="assets/footer_logo.png" alt="부자관광" class="site-footer__logo">
        <div class="site-footer__mini-meta">
          <p>(주)부자관광<span class="sep">·</span>대표 <strong>오기영</strong><span class="sep">·</span>사업자등록번호 123-45-67890</p>
          <p>경기도 평택시 OO로 123, 4층<span class="sep">·</span>대표전화 <strong>1577-0000</strong><span class="sep">·</span>이메일 contact@bujatour.co.kr</p>
          <p class="copyright">&copy; <span id="year"></span> Buja Tour. All rights reserved.</p>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
